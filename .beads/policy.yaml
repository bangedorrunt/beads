# ADR-0001 default. Generated by `br init`. Agents cannot --bypass-policy unless BR_OPERATOR=1.
allow_bypass: true
workflow:
  strict: true
  statuses: [open, in_progress, closed, deferred]
  transitions:
    open: [in_progress, closed, deferred]
    in_progress: [open, closed, deferred]
    deferred: [open]
    closed: [open]   # reopen only; NOT closed -> closed
  gates:
    # Gate *names* are chosen by legal_close(bead), not require_all.
    # Implementation: evaluate_gates runs crate::verify::legal_close against
    # recorded PASS rows for the transition.
    "open -> closed":
      require_legal_close: true
    "in_progress -> closed":
      require_legal_close: true
